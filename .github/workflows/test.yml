name: Test

on:
  # push covers main only: a branch with an open pull request is already
  # covered by the pull_request event, and listing branch patterns here ran
  # everything twice for every push to a feature/* or fix/* branch.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the run it interrupts: on a pull request the older run
# is cancelled rather than left to finish, which is most of the queue when a
# review loop pushes several heads. Never on main, where each commit's run is
# the record for that commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  js-unit-tests:
    name: JS Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build @hevcjs/core so vitest can resolve `@hevcjs/core` imports
      # in plugin tests (the resolution happens before vi.mock kicks in).
      # Locally this is unnecessary because dist/ persists between runs.
      - name: Build @hevcjs/core
        run: pnpm --filter @hevcjs/core build

      # tsup and vitest don't typecheck test files — tsc --noEmit does.
      - name: Typecheck (sources + tests)
        run: pnpm typecheck

      - name: Run JS unit tests
        run: pnpm test:unit

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Run unit tests
        working-directory: build
        run: ctest --output-on-failure --label-exclude oracle

      - name: Verify test count
        working-directory: build
        run: |
          TOTAL=$(ctest --label-exclude oracle -N 2>&1 | grep -oE 'Total Tests: [0-9]+' | grep -oE '[0-9]+')
          echo "Unit tests found: $TOTAL"
          if [ -z "$TOTAL" ] || [ "$TOTAL" -lt 70 ]; then
            echo "::error::Expected at least 70 unit tests, found ${TOTAL:-0}"
            exit 1
          fi

  oracle-tests:
    name: Oracle Tests (pixel-perfect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run oracle tests
        working-directory: build
        run: ctest --output-on-failure --label-regex oracle

      - name: Verify total test count (unit + oracle)
        working-directory: build
        run: |
          TOTAL=$(ctest -N 2>&1 | grep -oE 'Total Tests: [0-9]+' | grep -oE '[0-9]+')
          echo "Total tests found: $TOTAL"
          # 103 = base tests (unit + oracle). 128 requires edge-case fixtures
          # generated locally by tools/fetch_conformance.sh (x265 + ffmpeg).
          if [ -z "$TOTAL" ] || [ "$TOTAL" -lt 100 ]; then
            echo "::error::Expected at least 100 total tests, found ${TOTAL:-0}"
            exit 1
          fi

  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure (Release)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Benchmark — 1080p (50 frames, BBB)
        id: bench_1080p
        run: |
          OUTPUT=$(./build/hevc-decode tests/conformance/fixtures/bbb1080_50f.265 -o /dev/null 2>&1)
          echo "$OUTPUT"
          FPS=$(echo "$OUTPUT" | grep -oE '[0-9.]+ fps' | head -1)
          MS=$(echo "$OUTPUT" | grep -oE '[0-9.]+ ms/frame' | head -1)
          echo "fps=$FPS" >> "$GITHUB_OUTPUT"
          echo "ms=$MS" >> "$GITHUB_OUTPUT"

      - name: Benchmark — 4K (25 frames, BBB)
        id: bench_4k
        run: |
          OUTPUT=$(./build/hevc-decode tests/conformance/fixtures/bbb4k_25f.265 -o /dev/null 2>&1)
          echo "$OUTPUT"
          FPS=$(echo "$OUTPUT" | grep -oE '[0-9.]+ fps' | head -1)
          MS=$(echo "$OUTPUT" | grep -oE '[0-9.]+ ms/frame' | head -1)
          echo "fps=$FPS" >> "$GITHUB_OUTPUT"
          echo "ms=$MS" >> "$GITHUB_OUTPUT"

      - name: Post benchmark results to PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FPS_1080P: ${{ steps.bench_1080p.outputs.fps }}
          MS_1080P: ${{ steps.bench_1080p.outputs.ms }}
          FPS_4K: ${{ steps.bench_4k.outputs.fps }}
          MS_4K: ${{ steps.bench_4k.outputs.ms }}
        with:
          script: |
            const body = [
              '## Benchmark Results (GitHub Actions runner)',
              '',
              '| Resolution | FPS | ms/frame |',
              '|-----------|-----|----------|',
              `| 1080p (50f) | ${process.env.FPS_1080P} | ${process.env.MS_1080P} |`,
              `| 4K (25f) | ${process.env.FPS_4K} | ${process.env.MS_4K} |`,
              '',
              '> **Note**: GitHub Actions runners (2-core x86) are ~2-3x slower than Apple Silicon.',
              '> These numbers are for regression detection, not absolute performance.',
              '',
              '<sub>Auto-generated by CI benchmark</sub>',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes('Benchmark Results'));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
