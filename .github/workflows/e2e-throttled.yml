# The compute-aware cap specs, away from the pull request path.
#
# They throttle the renderer's CPU and loop until their own deadline, so each
# takes anywhere from one to eight minutes depending on how fast the cap
# converges on the runner of the day — measured on PR #373: sharding the suite
# four ways left them alone in shards of 444 and 460 seconds against 126 and
# 163 for the rest. What they measure is how the device class behaves, not
# whether a diff is correct, so a nightly run against the published site serves
# them better than a wait on every pull request.
name: E2E (compute-aware cap)

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC, daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  throttled:
    name: Compute-aware cap against the published site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Against the published site: a nightly run has no pull request preview
      # to point at. The specs report their measurement and skip rather than
      # fail when the throttle leaves transcoding above real time.
      - name: Run the compute-aware cap specs
        env:
          E2E_BASE_URL: https://hevcjs.dev/demo
        run: npx playwright test --project=local-chromium --grep "Compute-aware cap"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-throttled
          path: playwright-report/
          retention-days: 7
