name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC

# A new push supersedes the run it interrupts: on a pull request the older run
# is cancelled rather than left to finish, which is most of the queue when a
# review loop pushes several heads.
#
# Outside a pull request the group carries the run id, so every run is alone in
# its group and none is ever cancelled. Grouping those by ref would not have
# been enough: a group holds one running and one pending run, and a newer run
# replaces the pending one even with cancel-in-progress false, so three quick
# merges to main would have left the middle commit with no result at all — and
# in CodeQL, the Monday schedule would have shared a group with a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  security-events: write
  contents: read

jobs:
  # Gate for pull requests that only touch documentation. Jobs are skipped with
  # `if:` rather than the workflow with `paths-ignore`: a skipped job reports as
  # passed, whereas a skipped workflow leaves the required checks pending and
  # the pull request unmergeable. Every other event runs everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      cpp: ${{ steps.filter.outputs.cpp }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "cpp=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed API call stops this job (bash -e) instead of reading an empty
          # list as "docs only". The jobs below then run anyway, because they test
          # `needs.changes.result != 'success'`: a failed gate must never turn into
          # skipped jobs, which count as passed.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[] | .filename, (.previous_filename // empty)')
          # Anything that is neither Markdown nor under docs/ counts as code.
          if grep -qvE '\.md$|^docs/' <<< "$files"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # The C++ analysis only matters when the decoder sources or the build change.
          if grep -qE '^src/|^CMakeLists\.txt$' <<< "$files"; then cpp=true; else cpp=false; fi
          echo "cpp=$cpp" >> "$GITHUB_OUTPUT"

  analyze-cpp:
    name: Analyze C++
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.cpp == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: cpp
          queries: security-and-quality

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=OFF
          cmake --build build --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:cpp"

  analyze-js:
    name: Analyze JavaScript/TypeScript
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
