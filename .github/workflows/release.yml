name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  # npm trusted publishing: npm exchanges the job's OIDC token for a
  # short-lived publish token, so no npm secret is stored.
  id-token: write

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: npm
    steps:
      # Anything pushed with the default GITHUB_TOKEN triggers no workflow —
      # GitHub's loop guard. The release PR therefore arrived with zero checks
      # and sat blocked by branch protection until someone closed and reopened
      # it by hand. A GitHub App token has no such restriction.
      #
      # Optional: without the secrets this step fails, the token output is empty
      # and every use below falls back to GITHUB_TOKEN, i.e. today's behaviour.
      - name: Generate a token
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # The published package ships packages/core/wasm/*.wasm. Without this the
      # release would keep publishing whatever binary happens to be committed,
      # which is how 1.4.1 went out with a decoder built back in April.
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.8

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9

      # No dependency cache in the job that publishes: a poisoned cache would
      # end up in the packages.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
          registry-url: https://registry.npmjs.org/

      # changeset publish → pnpm publish → npm publish: the OIDC exchange is
      # done by the npm CLI, which needs 11.5.1+. An older npm would publish
      # unauthenticated and fail with an error that does not name the cause.
      - name: Check npm supports trusted publishing
        run: |
          v=$(npm --version)
          if [ "$(printf '%s\n' 11.5.1 "$v" | sort -V | head -n1)" != 11.5.1 ]; then
            echo "::error::npm $v cannot use trusted publishing (needs >= 11.5.1)"
            exit 1
          fi
          echo "npm $v"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM decoder
        run: pnpm build:wasm

      - name: Build JS packages
        run: pnpm build:js

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm run version
          publish: pnpm release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
