name: Build

on:
  push:
    branches: [main, feature/*, fix/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Upload build artifact
        if: matrix.build_type == 'Debug'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hevc-decode-debug
          path: build/hevc-decode

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.8

      # CMAKE_BUILD_TYPE matters to the comparison below: scripts/build-wasm.sh,
      # which produces the committed binary, configures Release. CMakeLists.txt
      # sets no default, and its WASM branch treats an empty type like Release
      # (only Debug takes -O0), so both happen to yield the same bytes today —
      # measured, not assumed. Passing it explicitly means the check compares
      # like with like instead of relying on that coincidence.
      - name: Configure
        run: emcmake cmake -B build-wasm -DBUILD_WASM=ON -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-wasm --parallel

      # packages/core/wasm/hevc-decode.wasm is committed, and nothing used to keep
      # it current: release.yml rebuilds before publishing, but never commits the
      # result back, so the copy in the repo stayed at whatever a contributor last
      # happened to commit. It is what a reader consults to answer "what does the
      # shipped decoder contain", and it answered wrong for months (#254).
      #
      # This compares the build just produced against the committed bytes, which
      # only works if the build is reproducible. Two container builds on the same
      # machine give identical bytes; whether this runner's native emsdk 6.0.8
      # agrees with a container on another host is what continue-on-error is here
      # to find out. Once it has been green across a few PRs, drop that line and
      # make the check required — until then a red run is information, not a block.
      - name: Committed WASM matches the sources
        continue-on-error: true
        run: |
          stale=""
          for copy in packages/core/wasm/hevc-decode.wasm demo/hevc-decode.wasm; do
            cmp -s build-wasm/hevc-decode.wasm "$copy" || stale="$stale $copy"
          done
          if [ -z "$stale" ]; then
            echo "Both committed decoders match a build of these sources."
            exit 0
          fi
          echo "::warning title=Committed WASM is stale::Stale against a build of the current sources:$stale"
          echo "Rebuilt: $(wc -c < build-wasm/hevc-decode.wasm) bytes, $(sha256sum build-wasm/hevc-decode.wasm | cut -c1-16)"
          for copy in $stale; do
            echo "Stale:   $copy — $(wc -c < "$copy") bytes, $(sha256sum "$copy" | cut -c1-16)"
          done
          echo "Run 'pnpm build:wasm && pnpm build:demo:wasm' and commit both copies."
          echo "If the sources did not change, the build is not reproducible across"
          echo "hosts and #254 should be settled by gitignoring the binary instead."
          exit 1

  # The oracle suite proves the decoder matches a stored reference; it does not
  # prove a change leaves the output alone. A PR that changes decoding and updates
  # the reference data in the same commit keeps the oracle green while the picture
  # moves, and the demo streams have no oracle reference at all — a regression
  # visible only at 1080p or 4K passes today (#257).
  #
  # It never goes red because the output moved — that is what a decoding fix
  # *does*, and a job red on every legitimate correction is trained away within a
  # month. It reports which streams moved, so the diff is read rather than
  # dismissed. It does go red when the comparison could not happen at all (no
  # stream decoded at both ends): a report of zero streams otherwise reads like a
  # pass, which is the one failure mode a check like this must not have.
  decoder-output-diff:
    name: Decoder output diff
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # Two builds and 42 decodes measure around three minutes; this only bounds a
    # decoder that loops on a stream, which would otherwise hold a runner for the
    # six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the base commit has to be reachable

      - name: Build the decoder at this head
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build -j --target hevc-decode

      # A worktree rather than a checkout: the streams decoded must be the ones at
      # this head — a fixture the PR adds has to be fed to both binaries — while
      # only the decoder comes from the base.
      - name: Build the decoder at the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          MERGE_BASE=$(git merge-base HEAD "$BASE_SHA")
          echo "Merge base: $MERGE_BASE"
          git worktree add --detach /tmp/base-decoder "$MERGE_BASE"
          cmake -S /tmp/base-decoder -B /tmp/base-decoder/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build /tmp/base-decoder/build -j --target hevc-decode

      - name: Compare the decoded output
        run: |
          REPORT=$(scripts/decoder-output-diff.sh \
            /tmp/base-decoder/build/hevc-decode build/hevc-decode)
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          # Stream names come from a glob over the repository, so a PR adding a
          # file whose name contains a newline could start a log line with "::"
          # and have the runner read it as a workflow command. Dropping those
          # lines from the log costs nothing — the summary above keeps them.
          echo "$REPORT" | grep -v '^::' || true
          # One line in the Checks tab, so the summary gets opened when it matters
          HEADLINE=$(echo "$REPORT" | head -1 | sed 's/\*\*//g')
          echo "::notice title=Decoder output::$HEADLINE"
