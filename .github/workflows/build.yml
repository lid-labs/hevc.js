name: Build

on:
  # push covers main only: a branch with an open pull request is already
  # covered by the pull_request event, and listing branch patterns here ran
  # everything twice for every push to a feature/* or fix/* branch.
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push supersedes the run it interrupts: on a pull request the older run
# is cancelled rather than left to finish, which is most of the queue when a
# review loop pushes several heads.
#
# Outside a pull request the group carries the run id, so every run is alone in
# its group and none is ever cancelled. Grouping those by ref would not have
# been enough: a group holds one running and one pending run, and a newer run
# replaces the pending one even with cancel-in-progress false, so three quick
# merges to main would have left the middle commit with no result at all — and
# in CodeQL, the Monday schedule would have shared a group with a push to main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Gate for pull requests that only touch documentation. Jobs are skipped with
  # `if:` rather than the workflow with `paths-ignore`: a skipped job reports as
  # passed, whereas a skipped workflow leaves the required checks pending and
  # the pull request unmergeable. Every other event runs everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed API call stops this job (bash -e) instead of reading an empty
          # list as "docs only". The jobs below then run anyway, because they test
          # `needs.changes.result != 'success'`: a failed gate must never turn into
          # skipped jobs, which count as passed.
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate -q '.[] | .filename, (.previous_filename // empty)')
          # Anything that is neither Markdown nor under docs/ counts as code.
          if grep -qvE '\.md$|^docs/' <<< "$files"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  build-native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    needs: changes
    if: ${{ !cancelled() }}
    # The gate is on the steps, not the job: a matrix job skipped before it
    # expands reports as "build-native" and leaves the required checks
    # "build-native (Debug)" and "(Release)" pending.
    steps:
      - if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        if: needs.changes.result != 'success' || needs.changes.outputs.code == 'true'
        run: cmake --build build --parallel

      - name: Upload build artifact
        if: (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hevc-decode-debug
          path: build/hevc-decode

  build-wasm:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.8

      # CMAKE_BUILD_TYPE matters to the comparison below: scripts/build-wasm.sh,
      # which produces the committed binary, configures Release. CMakeLists.txt
      # sets no default, and its WASM branch treats an empty type like Release
      # (only Debug takes -O0), so both happen to yield the same bytes today —
      # measured, not assumed. Passing it explicitly means the check compares
      # like with like instead of relying on that coincidence.
      - name: Configure
        run: emcmake cmake -B build-wasm -DBUILD_WASM=ON -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-wasm --parallel

      # packages/core/wasm/hevc-decode.wasm is committed, and nothing used to keep
      # it current: release.yml rebuilds before publishing, but never commits the
      # result back, so the copy in the repo stayed at whatever a contributor last
      # happened to commit. It is what a reader consults to answer "what does the
      # shipped decoder contain", and it answered wrong for months (#254).
      #
      # This compares the build just produced against the committed bytes, so it
      # depends on the build being reproducible. It is: this runner's native emsdk
      # 6.0.8 matched a container build from another host on ubuntu-24.04 and again
      # on ubuntu-26.04, so a red run is a stale binary and blocks the PR (#254).
      - name: Committed WASM matches the sources
        run: |
          stale=""
          for copy in packages/core/wasm/hevc-decode.wasm demo/hevc-decode.wasm; do
            cmp -s build-wasm/hevc-decode.wasm "$copy" || stale="$stale $copy"
          done
          if [ -z "$stale" ]; then
            echo "Both committed decoders match a build of these sources."
            exit 0
          fi
          echo "::warning title=Committed WASM is stale::Stale against a build of the current sources:$stale"
          echo "Rebuilt: $(wc -c < build-wasm/hevc-decode.wasm) bytes, $(sha256sum build-wasm/hevc-decode.wasm | cut -c1-16)"
          for copy in $stale; do
            echo "Stale:   $copy — $(wc -c < "$copy") bytes, $(sha256sum "$copy" | cut -c1-16)"
          done
          echo "Run 'pnpm build:wasm && pnpm build:demo:wasm' and commit both copies."
          echo "If the sources did not change, the build is not reproducible across"
          echo "hosts and #254 should be settled by gitignoring the binary instead."
          exit 1

      # Every other decoder check runs the native build, while @hevcjs/core ships
      # this one, built by another compiler (emscripten, -msimd128). This decodes
      # the stream set of decoder-output-diff.sh with both and fails on any
      # difference: both come from the same sources, so unlike an output that moves
      # between base and head, a difference here is never a legitimate change (#298).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Build the native decoder
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build -j --target hevc-decode

      - name: Native and WASM output match
        # 24 streams, 4K included: 38s on an Apple M4 Pro (2026-10-24). This only
        # bounds a decoder that loops on one.
        timeout-minutes: 15
        run: |
          # Same capture as in decoder-output-diff below: the report has to reach the
          # summary whatever the exit status.
          STATUS=0
          REPORT=$(scripts/wasm-native-diff.sh build/hevc-decode build-wasm) || STATUS=$?
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          echo "$REPORT" | grep -v '^::' || true
          exit "$STATUS"

  # The oracle suite proves the decoder matches a stored reference; it does not
  # prove a change leaves the output alone. A PR that changes decoding and updates
  # the reference data in the same commit keeps the oracle green while the picture
  # moves, and the demo streams have no oracle reference at all — a regression
  # visible only at 1080p or 4K passes today (#257).
  #
  # It never goes red because the output moved — that is what a decoding fix
  # *does*, and a job red on every legitimate correction is trained away within a
  # month. It reports which streams moved, so the diff is read rather than
  # dismissed. It does go red when the comparison could not happen at all (no
  # stream decoded at both ends): a report of zero streams otherwise reads like a
  # pass, which is the one failure mode a check like this must not have.
  decoder-output-diff:
    name: Decoder output diff
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'pull_request' && (!cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true')) }}
    # Two builds and 42 decodes measured 1m12s on this repository, the 4K stream
    # included; this only bounds a decoder that loops on one, which would
    # otherwise hold a runner for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # the base commit has to be reachable

      - name: Build the decoder at this head
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build -j --target hevc-decode

      # A worktree rather than a checkout: the streams decoded must be the ones at
      # this head — a fixture the PR adds has to be fed to both binaries — while
      # only the decoder comes from the base.
      - name: Build the decoder at the merge base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          MERGE_BASE=$(git merge-base HEAD "$BASE_SHA")
          echo "Merge base: $MERGE_BASE"
          git worktree add --detach /tmp/base-decoder "$MERGE_BASE"
          cmake -S /tmp/base-decoder -B /tmp/base-decoder/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build /tmp/base-decoder/build -j --target hevc-decode

      - name: Compare the decoded output
        run: |
          # Capture the status instead of letting bash -e abort here: the script
          # exits 2 when it compared nothing, and that is precisely the run whose
          # report has to be readable. Aborting would leave the summary, the log
          # and the notice all empty, with only a red step to explain itself.
          STATUS=0
          REPORT=$(scripts/decoder-output-diff.sh \
            /tmp/base-decoder/build/hevc-decode build/hevc-decode) || STATUS=$?
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          # Stream names come from a glob over the repository, so a PR adding a
          # file whose name contains a newline could start a log line with "::"
          # and have the runner read it as a workflow command. Dropping those
          # lines from the log costs nothing — the summary above keeps them.
          echo "$REPORT" | grep -v '^::' || true
          # One line in the Checks tab, so the summary gets opened when it matters
          HEADLINE=$(echo "$REPORT" | head -1 | sed 's/\*\*//g')
          echo "::notice title=Decoder output::$HEADLINE"
          exit "$STATUS"
