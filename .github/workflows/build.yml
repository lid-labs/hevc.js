name: Build

on:
  push:
    branches: [main, feature/*, fix/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build --parallel

      - name: Upload build artifact
        if: matrix.build_type == 'Debug'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hevc-decode-debug
          path: build/hevc-decode

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.8

      # CMAKE_BUILD_TYPE matters to the comparison below: scripts/build-wasm.sh,
      # which produces the committed binary, configures Release. CMakeLists.txt
      # sets no default, and its WASM branch treats an empty type like Release
      # (only Debug takes -O0), so both happen to yield the same bytes today —
      # measured, not assumed. Passing it explicitly means the check compares
      # like with like instead of relying on that coincidence.
      - name: Configure
        run: emcmake cmake -B build-wasm -DBUILD_WASM=ON -DBUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-wasm --parallel

      # packages/core/wasm/hevc-decode.wasm is committed, and nothing used to keep
      # it current: release.yml rebuilds before publishing, but never commits the
      # result back, so the copy in the repo stayed at whatever a contributor last
      # happened to commit. It is what a reader consults to answer "what does the
      # shipped decoder contain", and it answered wrong for months (#254).
      #
      # This compares the build just produced against the committed bytes, which
      # only works if the build is reproducible. Two container builds on the same
      # machine give identical bytes; whether this runner's native emsdk 6.0.8
      # agrees with a container on another host is what continue-on-error is here
      # to find out. Once it has been green across a few PRs, drop that line and
      # make the check required — until then a red run is information, not a block.
      - name: Committed WASM matches the sources
        continue-on-error: true
        run: |
          if cmp -s build-wasm/hevc-decode.wasm packages/core/wasm/hevc-decode.wasm; then
            echo "The committed decoder matches a build of these sources."
            exit 0
          fi
          echo "::warning title=Committed WASM is stale::packages/core/wasm/hevc-decode.wasm differs from a build of the current sources."
          echo "Committed: $(wc -c < packages/core/wasm/hevc-decode.wasm) bytes, $(sha256sum packages/core/wasm/hevc-decode.wasm | cut -c1-16)"
          echo "Rebuilt:   $(wc -c < build-wasm/hevc-decode.wasm) bytes, $(sha256sum build-wasm/hevc-decode.wasm | cut -c1-16)"
          echo "Run 'pnpm build:wasm' and commit packages/core/wasm/hevc-decode.wasm."
          echo "If the sources did not change, the build is not reproducible across"
          echo "hosts and #254 should be settled by gitignoring the binary instead."
          exit 1

