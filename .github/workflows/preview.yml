name: PR Preview (Vercel)

on:
  pull_request:
    branches: [main]
    # ready_for_review is here for the e2e job below, which only runs once the
    # pull request leaves draft: without this type, a branch that was only ever
    # pushed while draft would never see the suite.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  VERCEL_ORG_ID: team_5UPjuYH4MM0WGn8XpFczVT6O
  VERCEL_PROJECT_ID: prj_sHDUBtADHvKpwlA8DwSmUVGVz0x7

jobs:
  preview:
    # Forks have no access to VERCEL_TOKEN — skip instead of failing.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.8

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        run: |
          emcmake cmake -B build-wasm -DBUILD_WASM=ON -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF
          cmake --build build-wasm --parallel

      - name: Build JS packages
        run: pnpm build:js

      - name: Build demo bundles
        run: pnpm build:demo

      # Same assembly as pages.yml so the preview matches production exactly.
      - name: Prepare site
        run: |
          mkdir -p _site/demo
          cp -r site/* _site/
          cp -r demo/* _site/demo/
          sed -i 's|\.\./demo/|./demo/|g' _site/index.html
          find _site/docs -name '*.html' -exec sed -i 's|\.\./\.\./demo/|\.\./demo/|g' {} +
          find _site/demo -name '*.html' -exec sed -i 's|\.\./site/|\.\./|g' {} +

      - name: Deploy preview to Vercel
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN secret is not configured"; exit 1
          fi
          # Actions' default bash has no pipefail: without it, tail -1 hides a
          # deploy failure behind exit 0.
          set -o pipefail
          url=$(npx --yes vercel@58.0.0 deploy _site --token "$VERCEL_TOKEN" --yes | tail -1)
          case "$url" in
            https://*) ;;
            *) echo "::error::deploy did not return a URL: $url"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --edit-last --create-if-none \
            --body "🔍 Preview deployed: ${{ steps.deploy.outputs.url }}"

  e2e:
    name: E2E against preview (${{ matrix.shard }}/4)
    needs: preview
    # Only once the pull request is ready for review. The suite was 324 of the
    # 420 seconds a preview run took, on every push, while a review loop pushes
    # several heads per pull request — and it is the state that gets merged that
    # has to be green.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Non-blocking for now: the suite has never run in CI, so its stability and
    # duration are unmeasured. Flip to blocking once a few PRs have gone through.
    continue-on-error: true
    timeout-minutes: 30
    # Sharded now that the two unbalanced specs are out of this job. With them
    # in, four shards came out at 126, 163, 444 and 460 seconds — the matrix
    # isolated them instead of splitting them. Without them the suite is 46
    # tests in 8 files that Playwright runs serially at `workers: 1`, 309
    # seconds measured, and the two clean shards of that earlier run did their
    # share in 126 and 163.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # The preview serves the site at its root, the demo pages one level down.
      # The two compute-aware cap specs are left out: they throttle the CPU and
      # loop until their own deadline, so each takes anywhere from one to eight
      # minutes depending on how fast the cap converges on the runner of the
      # day. Measured here: sharding the suite four ways put them alone in two
      # shards of 444 and 460 seconds against 126 and 163 for the other two, so
      # they were the critical path rather than a fourth of it. They run nightly
      # instead, in e2e-throttled.yml, where their variance costs no one a wait.
      - name: Run E2E suite
        env:
          E2E_BASE_URL: ${{ needs.preview.outputs.url }}/demo
        run: >-
          npx playwright test --project=local-chromium
          --grep-invert "Compute-aware cap"
          --shard=${{ matrix.shard }}/4

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
